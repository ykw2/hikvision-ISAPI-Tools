[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hik-isapi"
version = "0.1.0"
description = "用 ISAPI 批次設定大量海康威視攝影機"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.32"]
webhook = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
hik-isapi = "hik_isapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "deploy/webhook"]
